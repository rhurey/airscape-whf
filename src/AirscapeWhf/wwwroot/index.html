<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E141C">
<title>Whole house fan</title>
<style>
  :root {
    --ink:      #0E141C;
    --surface:  #161F2B;
    --raised:   #1D2836;
    --edge:     #2B394A;
    --cool:     #64D2E8;
    --warm:     #E9A13B;
    --hot:      #E4693F;
    --text:     #DEE7F0;
    --muted:    #7B8DA1;
    --dim:      #55677B;

    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

    --flow-duration: 0s;
    --gap: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }

  .shell {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  /* ---- masthead ---- */

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .liveness { display: flex; align-items: center; gap: 7px; white-space: nowrap; }

  .beacon {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim);
    box-shadow: 0 0 0 0 transparent;
    transition: background 200ms ease;
  }
  .beacon.is-live { background: var(--cool); animation: pulse 3.2s ease-in-out infinite; }
  .beacon.is-stale { background: var(--warm); }
  .beacon.is-down { background: var(--hot); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(100, 210, 232, 0.45); }
    50%      { box-shadow: 0 0 0 5px rgba(100, 210, 232, 0); }
  }

  /* ---- headline: the one thing worth reading ---- */

  .headline {
    margin: 0;
    font-size: clamp(25px, 7.2vw, 36px);
    font-weight: 650;
    line-height: 1.14;
    letter-spacing: -0.022em;
    text-wrap: balance;
  }
  .headline.is-warn { color: var(--warm); }
  .headline.is-bad  { color: var(--hot); }

  /* ---- signature: the air path ---- */

  .airpath {
    display: grid;
    grid-template-columns: 1fr 34px 1fr 34px 1fr;
    align-items: stretch;
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 16px 12px;
  }

  .station { text-align: center; display: flex; flex-direction: column; gap: 5px; min-width: 0; }

  .station-name {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .station-temp {
    font-size: clamp(26px, 8vw, 34px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1;
    transition: color 600ms ease;
  }
  .station-temp::after { content: "\00B0"; font-size: 0.55em; vertical-align: super; opacity: 0.55; }
  .station-temp.is-void { color: var(--dim); }
  .station-temp.is-void::after { content: ""; }

  /* the conduit between stations — dashes move at a rate set by fan speed */
  .conduit { position: relative; align-self: center; height: 3px; border-radius: 2px; overflow: hidden; background: var(--edge); }

  .conduit::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 200%;
    background-image: repeating-linear-gradient(
      90deg,
      var(--cool) 0 5px,
      transparent 5px 11px
    );
    opacity: 0;
    transition: opacity 400ms ease;
  }
  .airpath.is-running .conduit::before {
    opacity: 0.9;
    animation: drift var(--flow-duration) linear infinite;
  }

  @keyframes drift { to { transform: translateX(-11px); } }

  /* ---- speed ---- */

  .panel {
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .panel-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 7px; }

  .step {
    appearance: none;
    border: 1px solid var(--edge);
    background: var(--raised);
    color: var(--muted);
    border-radius: 9px;
    padding: 15px 0;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
  }
  .step:hover { border-color: var(--dim); color: var(--text); }
  .step.is-on { background: var(--cool); border-color: var(--cool); color: #06222B; }
  .step.is-pending { border-color: var(--cool); color: var(--cool); animation: breathe 1.1s ease-in-out infinite; }

  @keyframes breathe { 50% { opacity: 0.42; } }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

  .action {
    appearance: none;
    border: 1px solid var(--edge);
    background: var(--raised);
    color: var(--text);
    border-radius: 9px;
    padding: 14px 10px;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 550;
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .action:hover { border-color: var(--dim); }
  .action.is-stop { color: var(--hot); }
  .action.is-stop:hover { background: rgba(228, 105, 63, 0.11); border-color: var(--hot); }

  button:focus-visible {
    outline: 2px solid var(--cool);
    outline-offset: 2px;
  }
  button[disabled] { opacity: 0.4; cursor: not-allowed; }

  /* ---- metrics ---- */

  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
    gap: 1px;
    background: var(--edge);
    border: 1px solid var(--edge);
    border-radius: 14px;
    overflow: hidden;
  }

  .metric { background: var(--surface); padding: 13px 12px; display: flex; flex-direction: column; gap: 3px; }

  .metric-value {
    font-size: 19px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .metric-unit { font-size: 0.62em; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }

  .metric-name {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .metric.is-hero .metric-value { color: var(--cool); }

  /* ---- footer ---- */

  .colophon {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--dim);
    padding: 0 4px;
  }

  .notice {
    display: none;
    border: 1px solid var(--warm);
    background: rgba(233, 161, 59, 0.1);
    color: var(--warm);
    border-radius: 11px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .notice.is-shown { display: block; }

  /* ---- cooldown ---- */

  .switch {
    appearance: none;
    width: 40px; height: 22px;
    border-radius: 11px;
    border: 1px solid var(--edge);
    background: var(--raised);
    position: relative;
    cursor: pointer;
    padding: 0;
    transition: background 180ms ease, border-color 180ms ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--dim);
    transition: transform 180ms ease, background 180ms ease;
  }
  .switch.is-on { background: var(--cool); border-color: var(--cool); }
  .switch.is-on::after { transform: translateX(18px); background: #06222B; }

  .preamble {
    margin: -4px 0 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--muted);
  }

  .rules { display: flex; flex-direction: column; gap: 8px; }

  .rule { display: grid; grid-template-columns: auto 62px auto 1fr auto; align-items: center; gap: 8px; }

  .rule-word {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .rule-temp, .rule-speed {
    background: var(--raised);
    border: 1px solid var(--edge);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 8px;
    font-family: var(--mono);
    font-size: 14px;
    width: 100%;
  }
  .rule-temp { text-align: center; font-variant-numeric: tabular-nums; }
  .rule-speed { font-family: var(--sans); }

  .rule-drop {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--dim);
    font-size: 18px;
    line-height: 1;
    padding: 6px 4px;
    cursor: pointer;
    border-radius: 6px;
  }
  .rule-drop:hover { color: var(--hot); }

  .rule-add {
    appearance: none;
    border: 1px dashed var(--edge);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 10px;
    font-family: var(--sans);
    font-size: 13.5px;
    cursor: pointer;
  }
  .rule-add:hover { border-color: var(--dim); color: var(--text); }

  .forecast {
    font-size: 13px;
    line-height: 1.45;
    color: var(--cool);
    padding-top: 2px;
  }
  .forecast.is-idle { color: var(--dim); }

  .rule-error {
    display: none;
    font-size: 13px;
    line-height: 1.45;
    color: var(--hot);
  }
  .rule-error.is-shown { display: block; }

  .collapsible { display: flex; flex-direction: column; gap: 13px; }
  .collapsible.is-hidden { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="shell">

  <header class="masthead">
    <span id="ident">Whole house fan</span>
    <span class="liveness">
      <span class="beacon" id="beacon" aria-hidden="true"></span>
      <span id="freshness">connecting</span>
    </span>
  </header>

  <h1 class="headline" id="headline" aria-live="polite">Waiting for the fan to answer</h1>

  <p class="notice" id="notice" role="status"></p>

  <section class="airpath" id="airpath" aria-label="Air path and temperatures">
    <div class="station">
      <span class="station-name">Outside</span>
      <span class="station-temp is-void" id="t-out">--</span>
    </div>
    <div class="conduit"></div>
    <div class="station">
      <span class="station-name">House</span>
      <span class="station-temp is-void" id="t-house">--</span>
    </div>
    <div class="conduit"></div>
    <div class="station">
      <span class="station-name">Attic</span>
      <span class="station-temp is-void" id="t-attic">--</span>
    </div>
  </section>

  <section class="panel" aria-label="Fan speed">
    <div class="panel-label">
      <span>Speed</span>
      <span id="timer-readout">no timer</span>
    </div>
    <div class="steps" id="steps" role="group" aria-label="Set fan speed"></div>
    <div class="actions">
      <button class="action" id="add-hour" type="button">Add 1 hour</button>
      <button class="action is-stop" id="turn-off" type="button">Turn off</button>
    </div>
  </section>

  <section class="panel" aria-label="Cooldown">
    <div class="panel-label">
      <span>Cooldown</span>
      <button class="switch" id="cooldown-toggle" type="button"
              role="switch" aria-checked="false" aria-label="Enable cooldown"></button>
    </div>
    <p class="preamble">As it gets colder outside, the fan eases off on its own. It never speeds up and never starts on its own.</p>
    <div class="collapsible is-hidden" id="cooldown-body">
      <div class="rules" id="rules"></div>
      <button class="rule-add" id="rule-add" type="button">Add a step</button>
      <p class="rule-error" id="rule-error" role="alert"></p>
      <p class="forecast" id="forecast"></p>
    </div>
  </section>

  <section class="metrics" id="metrics" aria-label="Performance"></section>

  <footer class="colophon" id="colophon"></footer>

</main>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const el = {
    ident: $("ident"), beacon: $("beacon"), freshness: $("freshness"),
    headline: $("headline"), notice: $("notice"), airpath: $("airpath"),
    out: $("t-out"), house: $("t-house"), attic: $("t-attic"),
    steps: $("steps"), timer: $("timer-readout"),
    addHour: $("add-hour"), turnOff: $("turn-off"),
    metrics: $("metrics"), colophon: $("colophon"),
    cooldownToggle: $("cooldown-toggle"), cooldownBody: $("cooldown-body"),
    rules: $("rules"), ruleAdd: $("rule-add"), ruleError: $("rule-error"),
    forecast: $("forecast"),
  };

  const COOL = [100, 210, 232];
  const WARM = [233, 161, 59];

  let state = null;
  let pendingSpeed = null;
  let pendingUntil = 0;
  let renderedMax = 0;

  // --- helpers ---------------------------------------------------------

  const lerpColor = (t) => {
    const c = COOL.map((v, i) => Math.round(v + (WARM[i] - v) * Math.min(1, Math.max(0, t))));
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
  };

  const fmtAge = (s) => {
    if (s < 45) return `${s}s ago`;
    if (s < 3600) return `${Math.round(s / 60)}m ago`;
    return `${Math.round(s / 3600)}h ago`;
  };

  const fmtTimer = (mins) => {
    if (!mins) return "no timer";
    const h = Math.floor(mins / 60), m = mins % 60;
    return h ? `${h}h ${m}m left` : `${m}m left`;
  };

  // --- rendering -------------------------------------------------------

  function buildSteps(max) {
    if (max === renderedMax) return;
    renderedMax = max;
    el.steps.replaceChildren();
    for (let i = 1; i <= max; i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.textContent = String(i);
      b.setAttribute("aria-label", `Speed ${i}`);
      b.addEventListener("click", () => request(`/api/speed/${i}`, i));
      el.steps.append(b);
    }
  }

  function renderStations(s) {
    const readings = [
      [el.out, s.outsideTempF],
      [el.house, s.houseTempF],
      [el.attic, s.atticTempF],
    ];
    const known = readings.map(([, v]) => v).filter((v) => typeof v === "number");
    const lo = Math.min(...known), hi = Math.max(...known);
    const span = hi - lo;

    for (const [node, value] of readings) {
      if (typeof value !== "number") {
        node.textContent = "--";
        node.classList.add("is-void");
        node.style.color = "";
        continue;
      }
      node.textContent = String(value);
      node.classList.remove("is-void");
      // Colour encodes where this reading sits between the coolest and warmest
      // thing we can see, so the picture reads at a glance without a legend.
      node.style.color = span > 0 ? lerpColor((value - lo) / span) : lerpColor(0.5);
    }

    const running = s.speed > 0 && s.online;
    el.airpath.classList.toggle("is-running", running);
    if (running) {
      // Dashes drift faster at higher speed: ~1.5s per cycle at speed 1 down to
      // ~0.35s at full. The motion is the CFM readout you don't have to read.
      const t = s.maxSpeed > 1 ? (s.speed - 1) / (s.maxSpeed - 1) : 1;
      el.airpath.style.setProperty("--flow-duration", `${(1.5 - t * 1.15).toFixed(2)}s`);
    }
  }

  function renderSteps(s) {
    const showPending = pendingSpeed !== null && Date.now() < pendingUntil && pendingSpeed !== s.speed;
    if (pendingSpeed !== null && (pendingSpeed === s.speed || Date.now() >= pendingUntil)) {
      pendingSpeed = null;
    }
    [...el.steps.children].forEach((b, i) => {
      const n = i + 1;
      b.classList.toggle("is-on", !showPending && s.speed === n);
      b.classList.toggle("is-pending", showPending && pendingSpeed === n);
      b.setAttribute("aria-pressed", String(s.speed === n));
    });
    el.turnOff.disabled = s.speed === 0 && !showPending;
  }

  function renderMetrics(s) {
    const cells = [
      { name: "Airflow", value: s.cfm, unit: "cfm" },
      { name: "Draw", value: s.powerWatts, unit: "W" },
      { name: "Efficiency", value: s.cfmPerWatt, unit: "cfm/W" },
      { name: "Cooling", value: s.coolingBtuh, unit: "btuh", fmt: (v) => v.toLocaleString() },
      { name: "EER", value: s.eer, hero: true },
    ].filter((c) => typeof c.value === "number");

    el.metrics.replaceChildren();
    for (const c of cells) {
      const cell = document.createElement("div");
      cell.className = c.hero ? "metric is-hero" : "metric";
      const v = document.createElement("span");
      v.className = "metric-value";
      v.textContent = c.fmt ? c.fmt(c.value) : String(c.value);
      if (c.unit) {
        const u = document.createElement("span");
        u.className = "metric-unit";
        u.textContent = c.unit;
        v.append(u);
      }
      const n = document.createElement("span");
      n.className = "metric-name";
      n.textContent = c.name;
      cell.append(v, n);
      el.metrics.append(cell);
    }
  }

  function render() {
    const s = state;
    if (!s) return;

    buildSteps(s.maxSpeed || 5);

    el.ident.textContent = s.model ? `${s.model} whole house fan` : "Whole house fan";
    el.headline.textContent = s.headline || "";
    el.headline.className = "headline" +
      (s.verdict === "Counterproductive" ? " is-bad" :
       s.verdict === "Marginal" ? " is-warn" : "");

    el.beacon.className = "beacon " +
      (!s.online ? "is-down" : s.ageSeconds > 90 ? "is-stale" : "is-live");
    el.freshness.textContent = s.observedAt ? fmtAge(s.ageSeconds) : "no reading";

    // Failure states explain themselves and say what to do about it.
    if (!s.online && s.lastError) {
      el.notice.textContent = `Can't reach the controller — ${s.lastError} Readings below are from ${fmtAge(s.ageSeconds)}; controls won't take effect until it answers.`;
      el.notice.classList.add("is-shown");
    } else if (s.doorMoving) {
      el.notice.textContent = "Damper doors are opening or closing. This takes about 30 seconds.";
      el.notice.classList.add("is-shown");
    } else if (s.interlocked) {
      el.notice.textContent = "An interlock is engaged, so the controller will refuse to start the fan. Check that any interlocked appliance is off.";
      el.notice.classList.add("is-shown");
    } else {
      el.notice.classList.remove("is-shown");
    }

    renderStations(s);
    renderSteps(s);
    renderMetrics(s);
    el.timer.textContent = fmtTimer(s.timerMinutes);

    const bits = [];
    if (s.ipAddress) bits.push(s.ipAddress);
    if (s.macAddress) bits.push(s.macAddress);
    if (s.softwareVersion) bits.push(`fw ${s.softwareVersion}`);
    if (s.dipSwitches) bits.push(`dip ${s.dipSwitches}`);
    if (s.remoteSwitch) bits.push(`rem ${s.remoteSwitch}`);
    el.colophon.textContent = bits.join("   ");

    renderForecast();
    // Latch state lives on the server, so re-read it periodically. This is a
    // local call and never touches the fan.
    if (cooldown.enabled && Date.now() - lastFetch > 15000) loadCooldown();
  }

  // --- commands --------------------------------------------------------

  async function request(path, optimisticSpeed) {
    if (optimisticSpeed !== undefined) {
      pendingSpeed = optimisticSpeed;
      // A full-range step sequence is several sequential round trips; give it room
      // before we give up on the optimistic display and fall back to reported state.
      pendingUntil = Date.now() + 12000;
      render();
    }
    try {
      await fetch(path, { method: "POST" });
    } catch {
      pendingSpeed = null;
      render();
    }
  }

  el.addHour.addEventListener("click", () => request("/api/timer/1"));
  el.turnOff.addEventListener("click", () => request("/api/off", 0));

  // --- cooldown --------------------------------------------------------

  let cooldown = { enabled: false, steps: [], releaseMarginF: 2, maxSpeed: 5, next: null };
  let rowCount = -1;
  let saveTimer = null;
  let lastFetch = 0;

  const speedLabel = (n) => (n === 0 ? "Off" : `Speed ${n}`);

  function renderRules() {
    // Only rebuild the rows when their number changes, so typing in a field
    // doesn't yank focus out from under the person doing it.
    if (cooldown.steps.length === rowCount) return;
    rowCount = cooldown.steps.length;
    el.rules.replaceChildren();

    cooldown.steps.forEach((step, i) => {
      const row = document.createElement("div");
      row.className = "rule";

      const below = document.createElement("span");
      below.className = "rule-word";
      below.textContent = "Below";

      const temp = document.createElement("input");
      temp.className = "rule-temp";
      temp.type = "number";
      temp.inputMode = "numeric";
      temp.min = "20";
      temp.max = "100";
      temp.value = String(step.belowF);
      temp.setAttribute("aria-label", `Temperature for step ${i + 1}`);
      temp.addEventListener("input", () => {
        cooldown.steps[i].belowF = parseInt(temp.value, 10) || 0;
        scheduleSave();
      });

      const arrow = document.createElement("span");
      arrow.className = "rule-word";
      arrow.textContent = "\u2192";

      const speed = document.createElement("select");
      speed.className = "rule-speed";
      speed.setAttribute("aria-label", `Speed for step ${i + 1}`);
      for (let n = 0; n <= (cooldown.maxSpeed || 5); n++) {
        const opt = document.createElement("option");
        opt.value = String(n);
        opt.textContent = speedLabel(n);
        speed.append(opt);
      }
      speed.value = String(step.speed);
      speed.addEventListener("change", () => {
        cooldown.steps[i].speed = parseInt(speed.value, 10);
        scheduleSave();
      });

      const drop = document.createElement("button");
      drop.className = "rule-drop";
      drop.type = "button";
      drop.textContent = "\u00D7";
      drop.setAttribute("aria-label", `Remove step ${i + 1}`);
      drop.addEventListener("click", () => {
        cooldown.steps.splice(i, 1);
        rowCount = -1;
        renderRules();
        scheduleSave();
      });

      row.append(below, temp, arrow, speed, drop);
      el.rules.append(row);
    });
  }

  function renderForecast() {
    const outside = state && state.outsideTempF;
    if (!cooldown.enabled || cooldown.steps.length === 0) {
      el.forecast.textContent = "";
      return;
    }
    if (typeof outside !== "number") {
      el.forecast.className = "forecast is-idle";
      el.forecast.textContent = "No outside reading, so nothing will fire.";
      return;
    }
    if (!cooldown.next) {
      el.forecast.className = "forecast is-idle";
      el.forecast.textContent = state && state.speed > 0
        ? `Outside is ${outside}\u00B0. Nothing left to fire tonight.`
        : `Outside is ${outside}\u00B0. Rules apply once the fan is running.`;
      return;
    }
    const { belowF, speed } = cooldown.next;
    const what = speed === 0 ? "stops" : `eases to ${speed}`;
    el.forecast.className = "forecast";
    el.forecast.textContent = `Next: ${what} below ${belowF}\u00B0 \u2014 it's ${outside}\u00B0 out now.`;
  }

  function renderCooldown() {
    el.cooldownToggle.className = cooldown.enabled ? "switch is-on" : "switch";
    el.cooldownToggle.setAttribute("aria-checked", String(cooldown.enabled));
    el.cooldownBody.className = cooldown.enabled ? "collapsible" : "collapsible is-hidden";
    renderRules();
    renderForecast();
  }

  function showRuleError(message) {
    el.ruleError.textContent = message || "";
    el.ruleError.classList.toggle("is-shown", Boolean(message));
  }

  async function loadCooldown() {
    lastFetch = Date.now();
    try {
      const r = await fetch("/api/cooldown");
      if (!r.ok) return;
      const next = await r.json();
      // Don't clobber rows the person is mid-edit on.
      if (saveTimer === null) cooldown = next;
      else cooldown.next = next.next;
      renderCooldown();
    } catch { /* the next snapshot will retry */ }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCooldown, 700);
  }

  async function saveCooldown() {
    saveTimer = null;
    try {
      const r = await fetch("/api/cooldown", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          enabled: cooldown.enabled,
          steps: cooldown.steps,
          releaseMarginF: cooldown.releaseMarginF,
        }),
      });
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        showRuleError(body.error || "Those rules couldn't be saved.");
        return;
      }
      showRuleError("");
      await loadCooldown();
    } catch {
      showRuleError("Couldn't reach the server to save that.");
    }
  }

  el.cooldownToggle.addEventListener("click", () => {
    cooldown.enabled = !cooldown.enabled;
    // Turning it on with no rules is a dead end; seed a sensible one.
    if (cooldown.enabled && cooldown.steps.length === 0) {
      cooldown.steps = [{ belowF: 60, speed: 0 }];
      rowCount = -1;
    }
    renderCooldown();
    scheduleSave();
  });

  el.ruleAdd.addEventListener("click", () => {
    const coldest = cooldown.steps.reduce((m, s) => Math.min(m, s.belowF), 70);
    cooldown.steps.push({ belowF: Math.max(20, coldest - 4), speed: 0 });
    rowCount = -1;
    renderCooldown();
    scheduleSave();
  });

  // --- transport -------------------------------------------------------

  let source = null;
  let backoff = 1000;

  function connect() {
    source?.close();
    source = new EventSource("/api/stream");

    source.onmessage = (e) => {
      backoff = 1000;
      try {
        state = JSON.parse(e.data);
        render();
      } catch { /* malformed frame; the next one will do */ }
    };

    source.onerror = () => {
      source.close();
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 15000);
    };
  }

  // Age is server-stamped at send time, so tick it locally between pushes rather
  // than letting the freshness readout freeze on a stale number.
  setInterval(() => {
    if (!state || !state.observedAt) return;
    state.ageSeconds += 1;
    el.freshness.textContent = fmtAge(state.ageSeconds);
    if (state.online && state.ageSeconds > 90) el.beacon.className = "beacon is-stale";
  }, 1000);

  connect();
  loadCooldown();
})();
</script>
</body>
</html>
