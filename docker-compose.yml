# Everything site-specific lives in ./config (read-only) and state in ./data.
# Before first start:
#
#   mkdir -p config data
#   cp config.example/appsettings.json config/   # then set Fan:Host
#   openssl rand -hex 32 > config/mcp-token      # enables /mcp
#   sudo chown 1654:1654 data                    # the container's user
#
# For HTTPS, put fullchain.pem and privkey.pem in config/certs/ (see
# deploy/renew-hook.sh). Without them the container serves HTTP only.

services:
  airscape-whf:
    build: .
    image: airscape-whf:latest
    container_name: airscape-whf
    restart: unless-stopped

    ports:
      # HTTP stays open for Home Assistant, scripts, and the health check. There
      # is deliberately no forced redirect to HTTPS -- that breaks simple curl
      # integrations on a trusted LAN for no real gain.
      - "8080:8080"
      - "443:8443"

    volumes:
      - ./config:/config:ro
      - ./data:/data

    # The healthcheck is defined in the image (the app checks its own /healthz).
    # It is liveness only: the service is doing its job even when the fan is
    # unreachable, so fan state deliberately does not fail it.

    read_only: true
    # The runtime wants a scratch directory even with a read-only root.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
